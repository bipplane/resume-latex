name: Build and Deploy Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository content
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Compile LaTeX to PDF
      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          # Replace 'resume.tex' with the name of your main .tex file
          root_file: 'resume.tex'
          # The output PDF will be named resume.pdf

      # 3. Rename the PDF to something more professional
      - name: Rename PDF
        run: mv resume.pdf Ryan_Chen_Resume.pdf

      # 4. Convert PDF to PNG for README preview
      - name: Convert PDF to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick pandoc
          convert -density 300 Ryan_Chen_Resume.pdf\[0\] -quality 90 -background white -alpha remove resume_preview.png
        # [0] specifies the first page only. -density 300 gives high resolution.
        # Added 'pandoc' package installation to this step to save setup time.

      # 5. Convert LaTeX to DOCX using Pandoc
      - name: Convert LaTeX to DOCX
        run: |
          pandoc resume.tex -f latex -t docx -o Ryan_Chen_Resume.docx

      # 6. Commit the generated PDF, DOCX, and PNG back to the repository
      - name: Commit files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Ryan_Chen_Resume.pdf Ryan_Chen_Resume.docx resume_preview.png
          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated build: Update resume PDF, DOCX, and preview"
            git push
          fi
          
      # 7. (Optional but Recommended) Deploy to GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Upload the entire directory (now containing PDF, DOCX, and PNG)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  
